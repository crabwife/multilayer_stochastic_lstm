name: Retention smoke

on:
  push:
    paths:
      - '.github/workflows/retention-smoke.yml'
      - 'i_retention/**'
      - 'g_nonergodic/src/processes.py'
      - 'config.json'
  workflow_dispatch:

jobs:
  small-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy matplotlib torch
      - run: python -m unittest discover -s i_retention/tests -v
      - name: Fit and score every schedule on a tiny dataset
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path('g_nonergodic/src').resolve()))
          sys.path.insert(0, str(Path('i_retention/src').resolve()))
          from retention_experiment import run

          config = json.loads(Path('config.json').read_text())
          config['retention'].update({
              'train_trajectories': 8, 'val_trajectories': 4,
              'test_trajectories': 4, 'context': 8,
              'train_horizon': 4, 'test_horizon': 8,
              'evaluation_horizons': [4, 8], 'width': 4, 'batch': 8,
              'epochs': 1, 'patience': 1, 'particles_train': 2,
              'particles_val': 2, 'particles_test': 8, 'repeats': 1,
              'bootstrap': 10, 'theory_trajectories': 16,
              'theory_horizon': 128,
          })
          with tempfile.TemporaryDirectory() as directory:
              result = run(config, directory)
              assert len(result) == 4 * 3 * 2
              assert len(result[result.horizon == 8]) == 4 * 3
              assert len(list(Path(directory).glob('checkpoints/**/*.pt'))) == 12
              assert (Path(directory) / 'paired_interventions.csv').exists()
          PY
